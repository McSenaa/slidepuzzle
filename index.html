<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sliding Puzzle 3x3</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, #1e293b, #0f172a 60%);
            overflow: hidden;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 20px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            border-radius: 14px;
            min-width: 110px;
        }

        .badge span {
            display: block;
            font-size: .8rem;
            opacity: .7;
            margin-bottom: 2px;
        }

        .badge strong {
            font-size: 1.3rem;
        }

        .board {
            width: 330px;
            height: 330px;
            position: relative;
            margin: auto;
            border-radius: 24px;
            background:
                linear-gradient(145deg, #111827, #1f2937);
            padding: 10px;
            box-shadow:
                inset 0 4px 10px rgba(255, 255, 255, .03),
                inset 0 -4px 10px rgba(0, 0, 0, .4);
        }

        .tile {
            width: 100px;
            height: 100px;
            position: absolute;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 700;
            cursor: pointer;

            background:
                linear-gradient(145deg, #38bdf8, #2563eb);

            box-shadow:
                0 10px 20px rgba(37, 99, 235, .35),
                inset 0 2px 4px rgba(255, 255, 255, .2);

            transition:
                left .22s cubic-bezier(.2, .8, .2, 1),
                top .22s cubic-bezier(.2, .8, .2, 1),
                transform .15s ease;
        }

        .tile:hover {
            transform: scale(1.05);
        }

        .tile:active {
            transform: scale(.96);
        }

        button {
            margin-top: 22px;
            border: none;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background:
                linear-gradient(135deg, #22c55e, #16a34a);

            box-shadow: 0 10px 20px rgba(34, 197, 94, .3);
            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .win {
            margin-top: 18px;
            font-size: 1.2rem;
            color: #facc15;
            font-weight: 700;
            min-height: 28px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Sliding Puzzle</h1>

        <div class="info">
            <div class="badge">
                <span>Moves</span>
                <strong id="moves">0</strong>
            </div>

            <div class="badge">
                <span>Grid</span>
                <strong>3 × 3</strong>
            </div>
        </div>

        <div class="board" id="board"></div>

        <button onclick="shuffle()">
            Acak Puzzle
        </button>

        <div class="win" id="winText"></div>

    </div>

    <script>

        const board = document.getElementById("board");

        const size = 3;
        const tileSize = 103;

        let tiles = [];
        let moves = 0;

        function init() {

            tiles = [1, 2, 3, 4, 5, 6, 7, 8, 0];

            render();
        }

        function render() {

            board.innerHTML = "";

            tiles.forEach((value, index) => {

                if (value === 0) return;

                const tile = document.createElement("div");

                tile.className = "tile";
                tile.textContent = value;

                const row = Math.floor(index / size);
                const col = index % size;

                tile.style.left = (col * tileSize + 10) + "px";
                tile.style.top = (row * tileSize + 10) + "px";

                tile.addEventListener("click", () => move(index));

                board.appendChild(tile);

            });

            document.getElementById("moves").textContent = moves;

            checkWin();
        }

        function move(index) {

            const empty = tiles.indexOf(0);

            const valid =
                (index === empty - 1 &&
                    Math.floor(index / size) === Math.floor(empty / size))

                ||

                (index === empty + 1 &&
                    Math.floor(index / size) === Math.floor(empty / size))

                ||

                index === empty - size
                ||

                index === empty + size;

            if (valid) {

                [tiles[index], tiles[empty]] =
                    [tiles[empty], tiles[index]];

                moves++;

                render();
            }
        }

        function shuffle() {

            for (let i = 0; i < 200; i++) {

                const empty = tiles.indexOf(0);

                const possible = [];

                const left = empty - 1;
                const right = empty + 1;
                const up = empty - size;
                const down = empty + size;

                if (
                    left >= 0 &&
                    Math.floor(left / size) === Math.floor(empty / size)
                ) {
                    possible.push(left);
                }

                if (
                    right < 9 &&
                    Math.floor(right / size) === Math.floor(empty / size)
                ) {
                    possible.push(right);
                }

                if (up >= 0) possible.push(up);
                if (down < 9) possible.push(down);

                const random =
                    possible[Math.floor(Math.random() * possible.length)];

                [tiles[random], tiles[empty]] =
                    [tiles[empty], tiles[random]];
            }

            moves = 0;

            document.getElementById("winText").textContent = "";

            render();
        }

        function checkWin() {

                let win = true;

                for (let i = 0; i < 8; i++) {

                    if (tiles[i] !== i + 1) {

                        win = false;
                        break;
                    }
                }

                if (win && moves > 0) {

                    document.getElementById("winText").textContent =
                        `🎉 Puzzle Selesai: ${moves} moves!, *iloveyou*`;

                } else {

                    document.getElementById("winText").textContent = "";
                }
            }

        init();

    </script>

</body>

</html>
